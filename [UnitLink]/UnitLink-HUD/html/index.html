<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UnitLink HUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar top"></div><div class="bar bot"></div>

<div class="hud" id="hud" hidden>
  <!-- top centre: compass + street -->
  <div class="tc" id="tc">
    <div class="compass" id="compass"><div class="caret"></div><div class="strip" id="strip"></div></div>
    <div class="hdg" id="hdg"></div>
    <div class="street glass" id="streetBox">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span id="street"></span><span class="sep" id="zoneSep"></span><em id="zone"></em>
    </div>
  </div>

  <!-- top right: logo, job, status -->
  <div class="tr">
    <div class="logo" id="logo"><b><span id="logoName"></span><em id="logoAccent"></em></b><span id="logoSub"></span></div>
    <div class="job" id="job"><span class="pid" id="pid"></span><span class="chip" id="jchip"></span><span id="jgrade"></span></div>
    <div class="rings" id="rings"></div>
  </div>

  <!-- bottom centre: vehicle -->
  <div class="veh" id="veh" hidden>
    <div class="dial">
      <svg viewBox="0 0 120 120">
        <g transform="rotate(135 60 60)">
          <circle cx="60" cy="60" r="52" pathLength="100" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="5" stroke-dasharray="75 100" stroke-linecap="round"/>
          <circle id="arc" cx="60" cy="60" r="52" pathLength="100" fill="none" stroke="#ff8a1f" stroke-width="5" stroke-dasharray="0 100" stroke-linecap="round"/>
        </g>
      </svg>
      <div class="read"><b id="spd">0</b><span id="unit">MPH</span></div>
    </div>
    <div class="vrow">
      <div class="vi red" id="belt"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M7 21v-7a5 5 0 0 1 10 0v7M8 9.5l8.5 9.5"/></svg></div>
      <div class="vt" id="fuel"><svg class="ico" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 8h2.5l2 2v8a1.5 1.5 0 0 1-3 0v-4H14"/></svg><span id="fuelv">0%</span></div>
      <div class="vt"><svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="18" cy="5" r="1.6"/><circle cx="6" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><path d="M6 6.6v10.8M12 6.6v10.8M18 6.6V12H6"/></svg><span id="gear">N</span></div>
      <div class="vi red" id="eng" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M4 10h3l2-2h5l2 2h2v3h2v-2h1.5v6H19v-2h-2v3h-3l-2 2H8l-2-2H4z"/></svg></div>
      <div class="vi" id="lights"><svg class="ico" viewBox="0 0 24 24"><path d="M11 6C6.5 6 4 8.7 4 12s2.5 6 7 6c1.6 0 2.5-2.7 2.5-6S12.6 6 11 6zM16 8h5M16 12h5M16 16h5"/></svg></div>
      <div class="vi" id="siren" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M7 17v-5a5 5 0 0 1 10 0v5M5 17h14v3H5zM12 3v2M4.5 7 6 8M19.5 7 18 8"/></svg></div>
      <div class="sig"><span id="sigL"><svg class="ico" viewBox="0 0 24 24"><path d="M20 12H5M10 7l-5 5 5 5"/></svg></span><span id="sigR"><svg class="ico" viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5"/></svg></span></div>
    </div>
  </div>

  <!-- bottom right: weapon, voice, clock -->
  <div class="br">
    <div class="weapon" id="weapon" hidden>
      <div class="wn" id="wname"></div>
      <div class="ammo" id="ammo"><span id="clip"></span> <small>/ <span id="reserve"></span></small></div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="clockrow">
      <div class="voice glass" id="voice" hidden>
        <div class="mic"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
        <div class="range" id="range" hidden><span></span><span></span><span></span></div>
        <span class="vlab" id="vlab" hidden></span>
        <span class="radio" id="radio" hidden></span>
      </div>
      <div class="clock glass" id="clock"><b id="time"></b><span id="date"></span></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
