      safr: { label: 'SAFR', icon: 'fire', tint: 'rgba(38, 13, 10, 0.92)', strip: 'stripes', colors: ['#ef4b5a', '#ffb020'] },
    },
    priorities: [{ label: 'Priority 1', short: 'P1', color: '#ef4b5a', pulse: true }, { label: 'Priority 2', short: 'P2', color: '#f5a524' }, { label: 'Priority 3', short: 'P3', color: '#3ba7ff' }],
    flash: { enabled: true, maxPriority: 2, speed: 500, strip: true, edge: true, glow: true },
    priorityIndicator: { pips: true, chip: true },
  },
  progress: { position: 'bottom', cancelKey: 'X' }, dialog: { backdrop: true }, context: { position: 'right' },
  list: { position: 'top-left' }, radial: { key: 'Z' }, textui: { position: 'right-center' },
});

let progTimer = null, progActive = false;
function progress(d) {
  clearTimeout(progTimer); progActive = true;
  E('progress:start', { canCancel: true, ...d });
  progTimer = setTimeout(() => { progActive = false; E('progress:end', { cancelled: false }); toast('Done.', 'success'); }, d.duration);
}
document.addEventListener('keydown', e => {
  if (progActive && e.key.toLowerCase() === 'x') { clearTimeout(progTimer); progActive = false; E('progress:end', { cancelled: true }); }
});

/* context menus */
const menus = {
  garage: { title: 'Tropical State Garage', description: 'Lot B', icon: 'garage', options: [
    { title: 'Retrieve Vehicle', description: '3 vehicles stored', icon: 'car', arrow: true, menu: 'vehicles' },
    { title: 'Fuel Level', description: 'Bison 4x4', icon: 'fuel', iconColor: '#22c38a', progress: 65, progressColor: '#22c38a' },
    { title: 'Vehicle Info', description: 'Hover for details', icon: 'info', metadata: [{ label: 'Plate', value: 'TSRP 001' }, { label: 'Engine', value: '92%', progress: 92 }, { label: 'Body', value: '78%', progress: 78 }] },
    { title: 'Give Keys', description: 'Share with a nearby player', icon: 'key', keybind: 'K' },
    { title: 'Impound Lot', description: 'Requires police access', icon: 'ban', disabled: true },
    { title: 'Lot B · 12 spaces free', icon: 'pin', readOnly: true },
  ]},
  vehicles: { title: 'Retrieve Vehicle', description: '3 stored', icon: 'car', parent: 'garage', options: [
    { title: 'Bison 4x4', description: 'TSRP 001', icon: 'car', metadata: [{ label: 'Fuel', value: '65%' }, { label: 'Mileage', value: '12,480 mi' }] },
    { title: 'Sandking XL', description: 'CREEK 22', icon: 'car', metadata: [{ label: 'Fuel', value: '30%' }, { label: 'Mileage', value: '48,102 mi' }] },
    { title: 'Rebla GTS', description: 'Needs repairs', icon: 'car', iconColor: '#f5a524', disabled: true },
  ]},
};
let ctxOpen = null;
const openCtx = id => { ctxOpen = id; const m = menus[id]; E('context:open', { ...m, canBack: !!m.parent }); };

/* list menu */
const listMenu = { title: "Benny's Customs", subtitle: 'Bison 4x4', icon: 'spray', options: [
  { label: 'Respray', icon: 'spray', description: 'Primary color', values: ['Red', 'Forest Green', 'Midnight Blue', 'Matte Black', 'White'] },
  { label: 'Wheels', icon: 'wheel', values: [{ label: 'Stock', description: 'Factory wheels' }, { label: 'Rugged', description: 'Off-road rims' }, { label: 'Beadlock', description: 'For rock crawling' }] },
  { label: 'Engine', icon: 'engine', description: 'Level 2 of 4', progress: 50 },
  { label: 'Neon Kit', icon: 'light', description: 'Underglow lights', checkbox: true },
  { label: 'Window Tint', icon: 'sun', values: ['None', 'Light', 'Dark', 'Limo'] },
  { label: 'Turbo', icon: 'turbo', description: 'Requires engine level 3', disabled: true },
  { label: 'Apply Changes', icon: 'check', description: 'Save and close' },
]};
let listOpen = false, ls = null;
document.addEventListener('keydown', e => {
  if (!listOpen) return;
  const o = listMenu.options, n = o.length, s = ls, cur = o[s.selected - 1];
  if (e.key === 'ArrowDown') s.selected = s.selected % n + 1;
  else if (e.key === 'ArrowUp') s.selected = (s.selected - 2 + n) % n + 1;
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && cur.values && !cur.disabled) {
    const d = e.key === 'ArrowRight' ? 1 : -1, len = cur.values.length;
    s.scroll[s.selected - 1] = (s.scroll[s.selected - 1] - 1 + d + len) % len + 1;
  } else if (e.key === 'Enter' && !cur.disabled) {
    if (cur.checkbox) s.checked[s.selected - 1] = !s.checked[s.selected - 1];
    else { listOpen = false; E('list:close'); toast(`Selected **${cur.label}**.`, 'success'); return; }
  } else if (e.key === 'Backspace' || e.key === 'Escape') { listOpen = false; E('list:close'); return; }
  else return;
  e.preventDefault(); E('list:state', s);
});

/* radial */
const radials = {
  main: [
    { label: 'Vehicle', icon: 'car', description: 'Doors, engine…', menu: 'vehicle' },
    { label: 'Emotes', icon: 'smile', description: 'Play an emote' },
    { label: 'Clothing', icon: 'shirt', description: 'Toggle items' },
    { label: 'Phone', icon: 'phone', description: '3 unread', badge: 3 },
    { label: 'Fuel', icon: 'fuel', description: '65% left', progress: 65, readOnly: true },
    { label: 'Walk Style', icon: 'walk', description: 'Change how you walk' },
    { label: 'Map', icon: 'map', description: 'Set a waypoint' },
  ],
  vehicle: [
    { label: 'Engine', icon: 'engine', description: 'Toggle engine' }, { label: 'Doors', icon: 'door', description: 'Open / close' },
    { label: 'Windows', icon: 'window', description: 'Roll up / down' }, { label: 'Interior', icon: 'light', description: 'Dome light' },
    { label: 'Lock', icon: 'lock', description: 'Lock vehicle' },
  ],
};
let radialStack = [];
const renderRadial = () => { const id = radialStack[radialStack.length - 1] || 'main'; E('radial:open', { items: radials[id], sub: id !== 'main', title: id === 'main' ? null : 'Vehicle' }); };

/* answers coming back from the NUI */
UI.mock = (name, d) => {
  switch (name) {
    case 'alert:close': E('alert:close'); toast(`Alert result: **${d.result}**`); break;
    case 'input:submit': E('input:close'); d.cancelled ? toast('Form cancelled.', 'warning') : toast('Values: ' + JSON.stringify(d.values), 'success'); break;
    case 'context:select': {
      const o = menus[ctxOpen].options[d.index - 1];
      if (o.menu) openCtx(o.menu); else { E('context:close'); ctxOpen = null; toast(`Selected **${o.title}**.`, 'success'); }
      break;
    }
    case 'context:back': { const p = menus[ctxOpen].parent; if (p) openCtx(p); else { E('context:close'); ctxOpen = null; } break; }
    case 'context:close': E('context:close'); ctxOpen = null; break;
    case 'radial:select': {
      const id = radialStack[radialStack.length - 1] || 'main', it = radials[id][d.index - 1];
      if (it.menu) { radialStack.push(it.menu); renderRadial(); } else { radialStack = []; E('radial:close'); toast(`Radial: **${it.label}**`, 'success'); }
      break;
    }
    case 'radial:back': radialStack.pop(); renderRadial(); break;
    case 'radial:close': radialStack = []; E('radial:close'); break;
    case 'minigame:done': toast(d.success ? 'Mini game passed.' : 'Mini game failed.', d.success ? 'success' : 'error'); break;
  }
};

const textSamples = [
  { key: 'E', title: 'Open Garage', description: 'Tropical State · Lot B' },
  { key: 'E', title: 'Refuel Vehicle', description: 'Pump 3', icon: 'fuel', color: '#22c38a' },
  { title: 'Gas Station', description: 'Route 68', options: [{ key: 'E', label: 'Refuel', icon: 'fuel' }, { key: 'G', label: 'Jerry Can', icon: 'box' }, { key: 'H', label: 'Car Wash', icon: 'drop' }] },
  { key: 'E', title: 'Talk' },
];
let textIdx = -1;

const demos = {
  notify() {
    const list = [
      () => E('notify', { type: 'success', message: 'Vehicle stored in **Tropical State Garage**.', duration: 6000 }),
      () => E('notify', { type: 'error', message: "You can't do that right now.", duration: 6000 }),
      () => E('notify', { type: 'warning', message: 'Your fuel is running low.', duration: 6000 }),
      () => E('notify', { type: 'info', message: 'Press **E** to open the menu.', duration: 6000 }),
      () => E('dispatch', { dept: 'police', code: '10-31', title: 'Robbery in Progress', message: 'Silent alarm at the general store.', priority: 1, location: 'Main St', duration: 9000 }),
    ];
    list.forEach((fn, i) => setTimeout(fn, i * 250));
  },
  progress: () => progress({ duration: 5000, label: 'Repairing Engine', description: 'Keep still while you work', icon: 'wrench' }),
  steps: () => progress({ duration: 6000, label: 'Crafting Lockpick', icon: 'box', color: '#a77bf3', steps: ['Cutting metal', 'Shaping pins', 'Filing edges', 'Assembling'] }),
  alert: () => E('alert:open', {
    header: 'Scrap vehicle?', subheader: "This can't be undone", content: 'You are about to scrap your **Bison 4x4**.', type: 'danger', icon: 'warning',
    callout: { type: 'warning', label: 'Heads up', text: 'Anything left in the trunk will be lost.' }, labels: { confirm: 'Scrap Vehicle', cancel: 'Keep It' },
  }),
  input: () => E('input:open', {
    heading: 'Register Vehicle', description: 'Fill out the DMV form', icon: 'edit', rows: [
      { type: 'input', label: 'Plate', placeholder: 'e.g. TSRP 001', icon: 'tag', required: true, max: 8, description: 'Up to 8 characters' },
      { type: 'input', label: 'PIN', icon: 'lock', password: true, default: '1234' },
      { type: 'number', label: 'Spare keys', min: 0, max: 5, default: 1 },
      { type: 'select', label: 'Garage', icon: 'garage', options: [{ value: 'lotA', label: 'Lot A' }, { value: 'lotB', label: 'Lot B' }, { value: 'barn', label: 'Barn' }], default: 'lotB' },
      { type: 'multi-select', label: 'Extras', options: ['Tracker', 'Roadside', 'Tint permit'], default: ['Tracker'] },
      { type: 'slider', label: 'Window tint', min: 0, max: 100, step: 5, default: 35 },
      { type: 'color', label: 'Primary color', default: '#3ba7ff' },
      { type: 'date', label: 'Registration date' },
      { type: 'date-range', label: 'Coverage' },
      { type: 'textarea', label: 'Notes', placeholder: 'Anything the DMV should know?' },
      { type: 'toggle', label: 'Auto-renew', description: 'Renew when it expires', default: true },
      { type: 'checkbox', label: 'I agree to the DMV terms', required: true },
    ],
  }),
  context: () => openCtx('garage'),
  list() { ls = { selected: 1, scroll: listMenu.options.map(o => (o.values ? 1 : 0)), checked: listMenu.options.map(() => false) }; listOpen = true; E('list:open', { ...listMenu, state: ls }); },
  radial() { radialStack = []; renderRadial(); },
  text() { textIdx = (textIdx + 1) % (textSamples.length + 1); textIdx === textSamples.length ? E('text:hide') : E('text:show', textSamples[textIdx]); },
  skill: () => E('minigame:start', { kind: 'skill', params: { rounds: [{ zone: 50, speed: 200 }, { zone: 40, speed: 260 }, { zone: 25, speed: 350 }], keys: ['E', 'Q'] } }),
  breach: () => E('minigame:start', { kind: 'breach', params: { nodes: 4, window: 20, speed: 70, speedUp: 1.15, shrink: 0.85, failOnWrongKey: true, maxSweeps: 4, keys: ['W', 'A', 'S', 'D'] } }),
  pattern: () => E('minigame:start', { kind: 'pattern', params: { grid: 3, length: 5, showSpeed: 420, timeout: 6000, rounds: 1 } }),
};
document.querySelectorAll('.pp [data-t]').forEach(b => b.onclick = () => { b.blur(); demos[b.dataset.t](); });
</script>
</body>
</html>
